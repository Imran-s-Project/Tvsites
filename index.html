<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechVerse / sites</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="This domain is reserved by TechnicalSky. The site is being built.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Hind+Siliguri:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12;
    --panel:#0f141b;
    --line: rgba(232,168,96,0.14);
    --line-strong: rgba(232,168,96,0.55);
    --amber:#e8a860;
    --text:#e7ecf1;
    --muted:#69737e;
    --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans:'Inter', system-ui, sans-serif;
    --bn:'Hind Siliguri', var(--sans);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* circuit field */
  svg.field{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  svg.field path{
    fill:none;
    stroke:var(--line);
    stroke-width:1;
  }
  svg.field path.trace{
    stroke:var(--line-strong);
    stroke-dasharray:600;
    stroke-dashoffset:600;
    animation:trace 2.6s cubic-bezier(.16,.8,.24,1) forwards;
  }
  svg.field circle.node{
    fill:var(--amber);
    opacity:0;
    animation:appear .5s ease forwards;
  }
  svg.field circle.pulse{
    fill:none;
    stroke:var(--amber);
    stroke-width:1;
    opacity:0;
  }

  @keyframes trace{
    to{ stroke-dashoffset:0; }
  }
  @keyframes appear{
    to{ opacity:.9; }
  }
  @keyframes pulseRing{
    0%{ r:2; opacity:.55; }
    100%{ r:22; opacity:0; }
  }

  .pulse.run{
    animation:pulseRing 2.8s ease-out infinite;
  }

  /* content */
  .content{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 24px;
    opacity:0;
    transform:translateY(6px);
    animation:rise 1s ease .9s forwards;
  }
  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }

  .mark{
    font-family:var(--mono);
    font-size:clamp(30px, 6vw, 56px);
    font-weight:500;
    letter-spacing:-0.01em;
    line-height:1;
  }
  .mark .slash{ color:var(--muted); padding:0 2px; }
  .mark .sites{ color:var(--amber); font-weight:400; }

  .status{
    margin-top:22px;
    font-size:15px;
    color:var(--text);
    letter-spacing:0.01em;
  }
  .status .dot{
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--amber);
    margin-right:9px;
    position:relative;
    top:-1px;
  }

  .bn{
    font-family:var(--bn);
    margin-top:10px;
    font-size:14.5px;
    color:var(--muted);
  }

  .meta{
    position:absolute;
    bottom:28px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:6px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--muted);
    z-index:2;
    opacity:0;
    animation:rise 1s ease 1.4s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    svg.field path.trace{ animation:none; stroke-dashoffset:0; }
    svg.field circle.node{ animation:none; opacity:.9; }
    .pulse.run{ animation:none; }
    .content, .meta{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <svg class="field" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path class="trace" d="M 80 120 L 260 120 L 320 180 L 320 260" style="animation-delay:.1s" />
    <path class="trace" d="M 1120 90 L 940 90 L 880 150 L 880 300 L 800 380" style="animation-delay:.3s" />
    <path class="trace" d="M 60 560 L 220 560 L 280 500 L 420 500" style="animation-delay:.5s" />
    <path class="trace" d="M 1140 600 L 980 600 L 920 540 L 780 540 L 720 480" style="animation-delay:.4s" />
    <path class="trace" d="M 600 40 L 600 130" style="animation-delay:.7s" />
    <path class="trace" d="M 600 660 L 600 560" style="animation-delay:.6s" />

    <circle class="node" cx="320" cy="180" r="2.5" style="animation-delay:.9s" />
    <circle class="node" cx="880" cy="150" r="2.5" style="animation-delay:1.0s" />
    <circle class="node" cx="420" cy="500" r="2.5" style="animation-delay:1.1s" />
    <circle class="node" cx="780" cy="540" r="2.5" style="animation-delay:1.0s" />
    <circle class="node" cx="600" cy="130" r="2.5" style="animation-delay:1.2s" />
    <circle class="node" cx="600" cy="560" r="2.5" style="animation-delay:1.2s" />

    <circle class="pulse run" cx="320" cy="180" r="2" style="animation-delay:2.2s" />
    <circle class="pulse run" cx="880" cy="150" r="2" style="animation-delay:3.4s" />
    <circle class="pulse run" cx="600" cy="130" r="2" style="animation-delay:4.1s" />
  </svg>

  <div class="content">
    <div class="mark">techverse<span class="slash">/</span><span class="sites">sites</span></div>
    <div class="status"><span class="dot"></span>Domain reserved. Build in progress.</div>
    <div class="bn">ডোমেইনটি সংরক্ষিত — নির্মাণকাজ চলছে</div>
  </div>

  <div class="meta">technicalsky &nbsp;·&nbsp; est. connection pending</div>
</div>

</body>
</html>
