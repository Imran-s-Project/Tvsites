<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tech Verse — শিক্ষা, প্রযুক্তি এবং উদ্ভাবনের একটি স্মার্ট প্ল্যাটফর্ম" />
  <meta name="theme-color" content="#0f0f23" />

  <!-- Open Graph -->
  <meta property="og:title" content="Tech Verse" />
  <meta property="og:description" content="শিক্ষা, প্রযুক্তি এবং উদ্ভাবনের একটি স্মার্ট প্ল্যাটফর্ম" />
  <meta property="og:type" content="website" />

  <title>Tech Verse</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/public/icon-192.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="/style/main.css" />
  <link rel="stylesheet" href="/style/components.css" />
</head>
<body>

  <!-- App Shell -->
  <div id="app">
    <!-- Navbar -->
    <nav id="navbar"></nav>

    <!-- Search Overlay -->
    <div id="search-overlay" class="search-overlay" aria-hidden="true">
      <div class="search-modal">
        <div class="search-header">
          <span class="search-icon">⌕</span>
          <input type="text" id="search-input" placeholder="খুঁজুন... (Ctrl+K)" autocomplete="off" />
          <kbd class="search-esc" onclick="window.Search.close()">ESC</kbd>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
    </div>

    <!-- Page Content -->
    <main id="page-content" role="main"></main>

    <!-- Footer -->
    <footer id="footer"></footer>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth }        from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore }   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { getAnalytics }   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js';
    import { firebaseConfig } from '/src/firebase/config.js';

    const app       = initializeApp(firebaseConfig);
    const auth      = getAuth(app);
    const db        = getFirestore(app);
    const analytics = getAnalytics(app);

    window.__firebase = { app, auth, db, analytics };

    // Boot the app after Firebase is ready
    const { App } = await import('/src/app.js');
    App.init();
  </script>

</body>
</html>
